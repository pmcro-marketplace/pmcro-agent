name: PMCR-O Federation Proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain existing provider Git objects
        run: |
          mkdir -p "$RUNNER_TEMP/pmcro-providers"
          for repo in orchestrator-agent planner-agent maker-agent checker-agent reflector-agent hook-agent marketplace-agent; do
            git clone --no-checkout "https://github.com/pmcro-marketplace/$repo.git" "$RUNNER_TEMP/pmcro-providers/$repo"
          done
      - name: Validate federation and negative gates
        run: |
          export PMCRO_PROVIDERS_DIR="$RUNNER_TEMP/pmcro-providers"
          python3 -B eng/test_marketplace.py
          python3 -B eng/test_cycle_host.py
          python3 -I -B eng/validate_marketplace.py --providers-dir "$PMCRO_PROVIDERS_DIR"
      - name: Reopen private automatic proof
        run: |
          proof_home="$(mktemp -d)"
          mkdir -m 700 "$proof_home/.pmcro" "$proof_home/.pmcro/projects" "$proof_home/.pmcro/projects/federation-proof"
          env HOME="$proof_home" python3 -I -B eng/validate_marketplace.py --providers-dir "$RUNNER_TEMP/pmcro-providers" --project-id federation-proof
          result="$(env HOME="$proof_home" python3 -I -B eng/run_cycle.py --providers-dir "$RUNNER_TEMP/pmcro-providers" --project-id federation-proof --execute-proof)"
          printf '%s\n' "$result"
          receipt_id="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["trail_id"])')"
          env HOME="$proof_home" python3 -I -B eng/run_cycle.py --providers-dir "$RUNNER_TEMP/pmcro-providers" --project-id federation-proof --verify-trail "$receipt_id"
          printf '%s\n' '## PMCR-O Federation' 'All eight pinned memberships and nine skills verified. Private validation frame sealed and reopened.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'All five local deterministic role callbacks completed; Checker PASS; seven sealed frames independently reopened. Native role agents and independent approval were not invoked.' >> "$GITHUB_STEP_SUMMARY"
